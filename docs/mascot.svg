<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 124" width="168" height="124" role="img" aria-label="A pipeline run splitting into a passing check and a failing one">
  <style>
    .seg { stroke-dasharray: 100; stroke-dashoffset: 100; }
    .trunk  { animation: trunk  4.4s linear infinite; }
    .pass   { animation: pass   4.4s linear infinite; }
    .fail   { animation: fail   4.4s linear infinite; }
    .okring { animation: okring 4.4s linear infinite; }
    .oktick { animation: oktick 4.4s linear infinite; }
    .koring { animation: koring 4.4s linear infinite; }
    .kotick { animation: kotick 4.4s linear infinite; }
    .trigger { animation: pulse 4.4s linear infinite; }

    @keyframes trunk {
      0% { stroke-dashoffset: 100 }
      9%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes pass {
      0%, 9% { stroke-dashoffset: 100 }
      30%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes okring {
      0%, 30% { stroke-dashoffset: 100 }
      40%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes oktick {
      0%, 40% { stroke-dashoffset: 100 }
      47%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes fail {
      0%, 50% { stroke-dashoffset: 100 }
      68%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes koring {
      0%, 68% { stroke-dashoffset: 100 }
      78%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes kotick {
      0%, 78% { stroke-dashoffset: 100 }
      85%, 93% { stroke-dashoffset: 0 }
      97%, 100% { stroke-dashoffset: 100 }
    }
    @keyframes pulse {
      0%, 1% { stroke-width: 5 }
      5% { stroke-width: 8 }
      10%, 100% { stroke-width: 5 }
    }
  </style>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- the track a run travels along -->
    <g stroke="#8b95a5" stroke-width="5" opacity="0.26">
      <path d="M49 62 H70"/>
      <path d="M70 62 C84 62 84 36 98 36 H112"/>
      <path d="M70 62 C84 62 84 88 98 88 H112"/>
      <circle cx="128" cy="36" r="15"/>
      <circle cx="128" cy="88" r="15"/>
    </g>

    <!-- the run advancing, then splitting in two -->
    <path class="seg trunk" d="M49 62 H70" stroke="#2088ff" stroke-width="5" pathLength="100"/>
    <path class="seg pass" d="M70 62 C84 62 84 36 98 36 H112" stroke="#2088ff" stroke-width="5" pathLength="100"/>
    <path class="seg fail" d="M70 62 C84 62 84 88 98 88 H112" stroke="#2088ff" stroke-width="5" pathLength="100"/>

    <!-- the branch that passed -->
    <g stroke="#3fb950" stroke-width="5">
      <circle class="seg okring" cx="128" cy="36" r="15" pathLength="100"/>
      <path class="seg oktick" d="M121 36 l5 6 l10 -12" pathLength="100"/>
    </g>

    <!-- the branch the gate refused -->
    <g stroke="#f85149" stroke-width="5">
      <circle class="seg koring" cx="128" cy="88" r="15" pathLength="100"/>
      <path class="seg kotick" d="M122 82 l12 12 M134 82 l-12 12" pathLength="100"/>
    </g>

    <!-- the trigger -->
    <circle class="trigger" cx="30" cy="62" r="19" stroke="#2088ff" stroke-width="5"/>
    <path d="M25 53 L41 62 L25 71 Z" fill="#2088ff" stroke="none"/>

  </g>
</svg>
