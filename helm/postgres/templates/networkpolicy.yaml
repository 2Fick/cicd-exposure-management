# Only grafana and the scan jobs may reach the database. Everything else in the cluster is refused.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
        - podSelector:
            matchLabels:
              app: trivy
        - podSelector:
            matchLabels:
              app: postgres-schema
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

---
# The schema job only opens outbound connections, to the database. Nothing in the cluster has any reason to reach it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-schema
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres-schema
  policyTypes:
    - Ingress