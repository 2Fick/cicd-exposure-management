# Applies the schema after every install and upgrade. It is a helm hook, so it runs once the database itself is up rather than at the same time.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-schema
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # hook-succeeded deletes the job once it worked, which stops finished pods from piling up and leaving orphans behind after an uninstall
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # The database can take a while to accept connections on a cold start
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
      containers:
        - name: psql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /schema/schema.sql
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: schema
              mountPath: /schema
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: schema
          configMap:
            name: postgres-schema
        - name: tmp
          emptyDir: {}