# Holds the SQL schema so the migration job can mount it as a file
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-schema
  namespace: {{ .Values.namespace | default .Release.Namespace }}
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS scans (
        id          SERIAL PRIMARY KEY,
        scanner     TEXT        NOT NULL,
        target      TEXT        NOT NULL,
        target_type TEXT        NOT NULL,
        scanned_at  TIMESTAMPTZ NOT NULL,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS vulnerabilities (
        id                SERIAL PRIMARY KEY,
        scan_id           INTEGER NOT NULL REFERENCES scans(id) ON DELETE CASCADE,
        cve_id            TEXT    NOT NULL,
        package_name      TEXT    NOT NULL,
        installed_version TEXT,
        fixed_version     TEXT,
        severity          TEXT    NOT NULL,
        title             TEXT,
        primary_url       TEXT
    );

    CREATE INDEX IF NOT EXISTS scans_scanned_at_idx
        ON scans (scanned_at);
    CREATE INDEX IF NOT EXISTS vulnerabilities_scan_id_idx
        ON vulnerabilities (scan_id);
    CREATE INDEX IF NOT EXISTS vulnerabilities_severity_idx
        ON vulnerabilities (severity);