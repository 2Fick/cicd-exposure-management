apiVersion: batch/v1
kind: Job
metadata:
  name: trivy-scan-{{ .Release.Revision }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        # Both containers run as this user, which is how the loader can read the report the scanner wrote on the shared volume
        fsGroup: 10001
      initContainers:
        - name: trivy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - image
            - --quiet
            - --scanners
            - vuln
            - --pkg-types
            - {{ .Values.pkgTypes | quote }}
            - --severity
            - {{ .Values.severity | quote }}
            # The default cache lives under /root, which a non root user
            # cannot write to
            - --cache-dir
            - /cache
            - --format
            - json
            - --output
            - /reports/scan.json
            - {{ .Values.target.image | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: reports
              mountPath: /reports
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      containers:
        - name: loader
          image: "{{ .Values.loader.repository }}:{{ .Values.loader.tag }}"
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/load.sql
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret }}
                  key: POSTGRES_DB
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: reports
              mountPath: /reports
            - name: sql
              mountPath: /sql
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: reports
          emptyDir: {}
        - name: sql
          configMap:
            name: trivy-loader-sql
        - name: tmp
          emptyDir: {}