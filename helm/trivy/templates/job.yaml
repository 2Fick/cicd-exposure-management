apiVersion: batch/v1
kind: Job
metadata:
  name: trivy-scan-{{ .Release.Revision }}
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: trivy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - image
            - --quiet
            - --scanners
            - vuln
            - --pkg-types
            - {{ .Values.pkgTypes | quote }}
            - --severity
            - {{ .Values.severity | quote }}
            - --format
            - json
            - --output
            - /reports/scan.json
            - {{ .Values.target.image | quote }}
          volumeMounts:
            - name: cache
              mountPath: /root/.cache/trivy
            - name: reports
              mountPath: /reports
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:

              memory: 2Gi
      containers:
        - name: loader
          image: "{{ .Values.loader.repository }}:{{ .Values.loader.tag }}"
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/load.sql
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret }}
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret }}
                  key: POSTGRES_DB
          volumeMounts:
            - name: reports
              mountPath: /reports
            - name: sql
              mountPath: /sql
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: reports
          emptyDir: {}
        - name: sql
          configMap:
            name: trivy-loader-sql