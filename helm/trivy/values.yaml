image:
  repository: aquasec/trivy
  tag: "0.74.0"

# One scan job is created per image in this list. The mix is deliberate: old
# distributions next to a current alpine base, so the dashboard shows how much
# the choice of base image actually costs.
targets:
  - "alpine:3.10"
  - "nginx:1.31-alpine"
  - "debian:10"
  - "python:3.9-slim"
  - "postgres:16-alpine"

# Only report what would actually block a build
severity: "HIGH,CRITICAL"

pkgTypes: "os"

loader:
  repository: postgres
  tag: "16-alpine"

database:
  host: postgres
  secret: postgres-credentials

namespace: exposure